<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Juggmybc | Official Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      color: white;
      overflow-x: hidden;

      background: linear-gradient(
        180deg,
        #168cff 0%,
        #4db5ff 45%,
        #b9e7ff 100%
      );
    }

    .cloud {
      position: fixed;
      width: 180px;
      height: 60px;
      background: white;
      border-radius: 100px;
      opacity: 0.8;
      filter: blur(1px);
      z-index: -1;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud::before {
      width: 80px;
      height: 80px;
      left: 30px;
      bottom: 15px;
    }

    .cloud::after {
      width: 100px;
      height: 100px;
      right: 25px;
      bottom: 10px;
    }

    .cloud1 {
      top: 80px;
      left: -50px;
    }

    .cloud2 {
      top: 300px;
      right: -70px;
      transform: scale(1.3);
    }

    .cloud3 {
      top: 550px;
      left: -60px;
      transform: scale(0.9);
    }

    .container {
      width: 90%;
      max-width: 550px;
      margin: auto;
      padding: 55px 0;
    }

    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: white;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #168cff;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin: 5px 0;
      font-size: 38px;
      text-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    .official {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    .link {
      display: block;
      width: 100%;
      padding: 20px;
      margin: 18px 0;
      border-radius: 18px;
      background: rgba(255,255,255,0.95);
      color: #111;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: 0.2s;
    }

    .link:hover {
      transform: scale(1.03);
    }

    .social-text {
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .vigor {
      background: #111;
      color: white;
    }

    .arrow {
      color: red;
      font-size: 55px;
      font-weight: bold;
      line-height: 45px;
      margin-top: 15px;
    }

    .rep {
      font-size: 28px;
      font-weight: 900;
      margin: 5px 0 20px;
      text-shadow: 0 3px 7px rgba(0,0,0,0.25);
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <div class="container">

    <div class="profile">
      JMBC
    </div>

    <h1>Juggmybc</h1>

    <div class="official">
      OFFICIAL LINKS
    </div>

    <a class="link" href="https://www.instagram.com/itsamir_again" target="_blank">
      📸 Instagram
    </a>

    <div class="social-text">
      GO FOLLOW ME
    </div>

    <a class="link" href="https://www.tiktok.com/@juggmybc" target="_blank">
      🎵 TikTok
    </a>

    <div class="social-text">
      GO FOLLOW ME
    </div>

    <a class="link vigor" href="https://vigorbuy.com/m/" target="_blank">
      🔗 VIGOR
    </a>

    <div class="arrow">
      ↓
    </div>

    <div class="rep">
      REP CLOTHES
    </div>

    <div class="footer">
      © 2026 Juggmybc
    </div>

  </div>

</body>
</html>
